# Application info
spring.application.name=spring-mcp-proxy

# MCP Server configuration
spring.ai.mcp.server.name=spring-mcp-proxy
spring.ai.mcp.server.version=0.0.1-SNAPSHOT

# Disable stdio transport — HTTP only
spring.ai.mcp.server.stdio=false

# MCP HTTP endpoints (Spring AI defaults):
#   SSE stream:    GET  /sse
#   MCP messages:  POST /mcp/message

# API key for MCP endpoint authentication (override via MCP_SERVER_API_KEY env var)
mcp.server.api-key=changeme
